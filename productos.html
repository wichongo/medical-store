<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Catálogo de refrigeradores, calentadores de sangre y esterilizadores de sobremesa. Consulta fichas técnicas y solicita una cotización.">
    <title>Productos | Medical Healthcare</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=2.2">
    <!-- Tema opcional: quitar esta línea restaura el encabezado original. -->
    <link rel="stylesheet" href="css/header-light.css?v=1.1">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="container nav">
            <div class="logo-container">
                <img src="images/logo-medical.png" alt="Logo Medical Healthcare" class="logo-img">
                <span class="logo-text">Medical Healthcare</span>
            </div>
            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="about.html">Acerca</a>
                <!-- Menú desplegable para Productos -->
                <div class="dropdown">
                    <button type="button" class="dropbtn active" aria-expanded="false" aria-controls="menu-productos">Productos <span aria-hidden="true">▾</span></button>
                    <div class="dropdown-content" id="menu-productos" hidden><!-- generado por js/main.js --></div>
                </div>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- CATÁLOGO (filtros y cards se generan desde js/productos-data.js) -->
        <section id="productos">
            <div class="container">
                <h1 class="page-title">Nuestros Productos</h1>
                <div class="filtros" id="filtros"></div>
                <div class="products" id="catalogo"></div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>© 2026 Medical Healthcare - Todos los derechos reservados</p>
        </div>
    </footer>


    <!-- MODAL DE PRODUCTO -->
    <dialog id="productModal" class="modal" aria-labelledby="product-title">
        <div class="modal-content">
            <button class="close" type="button" aria-label="Cerrar detalles" autofocus>×</button>
            <div id="modalBody"></div>
        </div>
    </dialog>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/51942736112?text=Hola,%20quiero%20más%20información%20sobre%20sus%20equipos%20médicos"
        class="whatsapp-float" aria-label="Contactar por WhatsApp" target="_blank" rel="noopener">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" fill="none"><path d="M27 15.5a11 11 0 0 1-16.3 9.6L5 27l1.8-5.6A11 11 0 1 1 27 15.5Z" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5c-.5-.6-1.5-.4-2 .3-1.4 2.1.1 5.2 2.8 7.9s5.8 4.2 7.9 2.8c.7-.5.9-1.5.3-2l-2.1-1.6c-.4-.3-.8-.2-1.1.1l-1 1c-1.8-.8-3.1-2.1-3.9-3.9l1-1c.3-.3.4-.7.1-1.1Z" fill="white"/></svg>
    </a>

    <!-- JS -->
    <script src="js/productos-data.js?v=2.2"></script>
    <script src="js/main.js?v=2.2"></script>
</body>

</html>
