<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=2.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="container nav">
            <div class="logo-container">
                <img src="images/logo-medical.png" alt="Logo Medical Store Perú" class="logo-img">
                <span class="logo-text">Medical Store</span>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="about.html">Acerca</a>
                <!-- Menú desplegable para Productos -->
                <div class="dropdown">
                    <a href="productos.html" class="dropbtn">Productos</a>

            </nav>
        </div>
    </header>

    <main>
        <!-- CATÁLOGO (filtros y cards se generan desde js/productos-data.js) -->

            <div class="container">
                <h2>Nuestros Productos</h2>
                <div class="filtros" id="filtros"></div>
                <div class="products" id="catalogo"></div>

    <footer>

            <p>© 2026 Medical Store Perú - Todos los derechos reservados</p>
        </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" role="button" aria-label="Cerrar">×</span>
            <div id="modalBody"></div>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/51974467392?text=Hola,%20quiero%20más%20información%20sobre%20sus%20equipos%20médicos"

    <!-- JS -->
    <script src="js/productos-data.js?v=2.0"></script>
